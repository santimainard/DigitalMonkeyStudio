<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de pagos</title>
<style>body{font:16px/1.6 system-ui;background:#eef2ed;color:#183d32;margin:0}main{max-width:640px;margin:50px auto;background:white;padding:36px;border-radius:18px}h1{line-height:1.2}button,a{display:inline-block;padding:12px 16px;border:0;border-radius:8px;background:#235c46;color:white;cursor:pointer;text-decoration:none;font:inherit;margin:8px 4px 8px 0}select{padding:10px;width:100%;font:inherit}label{display:block;margin:18px 0}small{display:block;overflow-wrap:anywhere}.notice{padding:16px;background:#eef3d6;border-radius:8px}.amount{font-size:36px;font-weight:750}.decline{background:#a44537}</style>
</head>
<body>
<main>
<p>UM / SERVICIO EXTERNO DE PRUEBAS</p>
<h1>Simulador de pagos</h1>
<p class="notice">No se cobra dinero real ni se solicitan datos de tarjetas.</p>
<p class="amount" th:text="|${payment.currency} ${payment.amount}|">
</p>
<p th:text="|Estado: ${payment.status}|">
</p>
<p class="notice" th:if="${payment.cancellationPercent != null}" th:text="|Cancelación procesada. Reembolsado: ${payment.currency} ${payment.refundedAmount}.|"></p>
<small th:text="|Referencia: ${payment.merchantReference}|">
</small>
<small th:text="|Vencimiento UTC: ${payment.expiresAt}|">
</small>
<form th:if="${payment.status == 'PENDING'}" th:action="@{/checkout/{id}/decision(id=${payment.paymentId})}" method="post">
<label>Entrega del resultado<select name="callbackMode">
<option value="NORMAL">Normal</option>
<option value="DUPLICATE">Callback duplicado</option>
<option value="DELAY">Sin callback inmediato (conciliación posterior)</option>
</select>
</label>
<button name="action" value="APPROVE">Aprobar pago</button>
<button class="decline" name="action" value="REJECT">Rechazar</button>
<button class="decline" name="action" value="CANCEL">Cancelar</button>
</form>
<form th:unless="${payment.status == 'PENDING'}" th:action="@{/checkout/{id}/notify(id=${payment.paymentId})}" method="post">
<button>Reenviar callback duplicado</button>
</form>
<a th:href="${returnUrl}">Volver a mi reserva →</a>
</main>
</body>
</html>
