server:
  port: ${PORT:8081}
  servlet:
    session:
      cookie:
        name: UM_PAY_SESSION
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/payments}
    username: ${DATABASE_USER:payments}
    password: ${DATABASE_PASSWORD}
  thymeleaf.cache: false
management.endpoints.web.exposure.include: health
simulator:
  api-key: ${PAYMENT_API_KEY}
  webhook-token: ${PAYMENT_WEBHOOK_TOKEN}
  public-url: ${PAYMENT_PUBLIC_URL:http://localhost:8081}
  return-url: ${PLATFORM_PUBLIC_URL:http://localhost:8080}
  callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:8080/api/v1/payment-events}
