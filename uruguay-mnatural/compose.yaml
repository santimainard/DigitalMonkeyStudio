services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tourism
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Ejecutar scripts/setup primero}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["tourism-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourism -d tourism"]
      interval: 5s
      retries: 20
  payments-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${PAYMENTS_DATABASE_PASSWORD:?Ejecutar scripts/setup primero}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["payments-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      retries: 20
  payments:
    build:
      context: .
      args: {MODULE: payment-simulator}
    ports: ["127.0.0.1:8081:8081"]
    environment:
      DATABASE_URL: jdbc:postgresql://payments-database:5432/payments
      DATABASE_USER: payments
      DATABASE_PASSWORD: ${PAYMENTS_DATABASE_PASSWORD}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN}
      PAYMENT_CALLBACK_URL: http://platform:8080/api/v1/payment-events
      PAYMENT_PUBLIC_URL: http://localhost:8081
      PLATFORM_PUBLIC_URL: http://localhost:8080
    depends_on:
      payments-database: {condition: service_healthy}
  platform:
    build:
      context: .
      args: {MODULE: platform}
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/tourism
      DATABASE_USER: tourism
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_DATA: ${DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      PAYMENT_BASE_URL: http://payments:8081
      PAYMENT_CALLBACK_URL: http://platform:8080/api/v1/payment-events
      PAYMENT_API_KEY: ${PAYMENT_API_KEY}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN}
    depends_on:
      database: {condition: service_healthy}
      payments: {condition: service_started}
volumes:
  tourism-data:
  payments-data:
