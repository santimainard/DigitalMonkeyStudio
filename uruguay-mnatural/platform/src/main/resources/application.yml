server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: UM_SESSION
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tourism}
    username: ${DATABASE_USER:tourism}
    password: ${DATABASE_PASSWORD}
  sql.init.mode: never
  jackson.time-zone: America/Montevideo
  thymeleaf.cache: false
management.endpoints.web.exposure.include: health
app:
  admin-email: ${ADMIN_EMAIL:admin@example.test}
  admin-password: ${ADMIN_PASSWORD}
  demo: ${DEMO_DATA:false}
payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8081}
  callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:8080/api/v1/payment-events}
  api-key: ${PAYMENT_API_KEY}
  webhook-token: ${PAYMENT_WEBHOOK_TOKEN}
  hold-minutes: 10
  reconciliation-delay: 30000
weather.enabled: false
