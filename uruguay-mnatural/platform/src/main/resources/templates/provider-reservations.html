<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reservas recibidas · Uruguay Mnatural</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
<script defer th:src="@{/js/app.js}">
</script>
</head>
<body>
<header th:replace="~{fragments :: header}">
</header>
<main>
<div class="notice success" th:if="${success}" th:text="${success}">
</div>
<a th:href="@{/provider}">← Mi emprendimiento</a>
<h1>Reservas recibidas</h1>
<p th:text="|Participantes con lugares comprometidos en este filtro: ${people}|">
</p>
<form method="get" th:action="@{/provider/reservations}" class="row">
<label>ID actividad<input name="activityId" type="number" min="1" th:value="${param.activityId}">
</label>
<label>ID instancia<input name="instanceId" type="number" min="1" th:value="${param.instanceId}">
</label>
<label>Estado<select name="status">
<option value="">Todos</option>
<option th:each="s:${ {'PENDING_PAYMENT','PAYMENT_UNCERTAIN','CONFIRMED','COMPLETED','REJECTED','EXPIRED','PAYMENT_CANCELLED'} }" th:value="${s}" th:text="${@fmt.state(s)}" th:selected="${param.status != null and param.status[0] == s}">
</option>
</select>
</label>
<button>Filtrar</button>
</form>
<p class="empty" th:if="${#lists.isEmpty(result.content)}">No hay reservas para estos filtros.</p>
<div class="table-wrap">
<table th:unless="${#lists.isEmpty(result.content)}">
<thead>
<tr>
<th>Actividad y fecha</th>
<th>Titular</th>
<th>Participantes</th>
<th>Reserva y pago</th>
<th>Total</th>
</tr>
</thead>
<tbody>
<tr th:each="r:${result.content}">
<td>
<strong th:text="${r.activity_name_snapshot}">
</strong>
<small th:text="${@fmt.date(r.starts_at_snapshot)}">
</small>
<small th:text="${r.code}">
</small>
</td>
<td>
<span th:text="|${r.first_name} ${r.last_name}|">
</span>
<small th:text="${r.email}">
</small>
<small th:text="|Documento: ${r.document}|">
</small>
</td>
<td th:text="${r.participant_count}">
</td>
<td>
<span th:text="${@fmt.state(r.status)}">
</span>
<small th:text="${@fmt.state(r.payment_status)}">
</small>
</td>
<td th:text="|UYU ${r.total_amount}|">
</td>
</tr>
</tbody>
</table>
</div>
<div th:replace="~{fragments :: pagination(${result})}">
</div>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body>
</html>
