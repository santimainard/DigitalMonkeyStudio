<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fechas y cupos · Uruguay Mnatural</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/css/workspace.css}">
<script defer th:src="@{/js/app.js}">
</script>
<link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/portal.css}"></head>
<body class="workspace-page task-page">
<header th:replace="~{fragments :: workspaceHeader}"></header>
<div class="workspace-shell"><aside th:replace="~{fragments :: workspaceRail('PROVIDER', true)}"></aside>
<main class="workspace-content">
<div class="notice success" th:if="${success}" th:text="${success}">
</div>
<a class="page-back" th:href="@{/provider/activities}">← Mis actividades</a>
<div class="workspace-heading"><div><p class="section-overline">FECHAS Y CUPOS</p><h1 th:text="${activity.name}"></h1><p>Agregá fechas, definí precios y administrá los cupos de esta actividad.</p></div></div>
<form th:action="@{/provider/activities/{id}/instances(id=${activity.id})}" method="post" class="panel row">
<label>Inicio (hora de Uruguay)<input type="datetime-local" name="startsAt" required>
</label>
<label>Cupo (vacío = ilimitado)<input type="number" name="capacity" min="1">
</label>
<label>Precio por persona (UYU)<input type="number" name="unitPrice" min="0.01" step="0.01" th:value="${activity.unit_price}" required></label>
<button>Agregar fecha</button>
</form>
<p class="empty" th:if="${#lists.isEmpty(instances)}">No hay fechas programadas.</p>
<article class="panel" th:each="i:${instances}">
<p th:text="|Finaliza ${@fmt.date(i.ends_at)} · ${i.cancelled ? 'Cancelada' : (i.active ? 'Activa' : 'Eliminada')}|">
</p>
<p th:text="${i.available == null ? 'Cupo ilimitado' : i.available + ' lugares libres'}">
</p>
<p th:text="|Precio por persona: UYU ${i.unit_price}|"></p>
<form th:if="${i.active}" th:action="@{/provider/activities/{id}/instances(id=${activity.id})}" method="post" class="row">
<input type="hidden" name="instanceId" th:value="${i.id}">
<label>Inicio<input type="datetime-local" name="startsAt" th:value="${@fmt.input(i.starts_at)}" required>
</label>
<label>Cupo<input type="number" name="capacity" min="1" th:value="${i.capacity}">
</label>
<label>Precio por persona (UYU)<input type="number" name="unitPrice" min="0.01" step="0.01" th:value="${i.unit_price}" required></label>
<button>Guardar</button>
<button class="danger" name="delete" value="true" data-confirm="¿Eliminar esta fecha?">Eliminar</button>
</form>
<form th:if="${i.active}" th:action="@{/provider/activities/{id}/instances/{instanceId}/cancel(id=${activity.id},instanceId=${i.id})}" method="post">
<button class="danger" data-confirm="¿Cancelar esta instancia? Se devolverá el 100 % a las reservas pagadas.">Cancelar instancia y reembolsar</button></form>
<p th:if="${i.cancelled}">La instancia está cancelada. Consultá las reservas de esta fecha para ver los reembolsos y las conciliaciones pendientes.</p>
<a th:href="@{/provider/reservations(instanceId=${i.id})}">Consultar reservas de esta fecha</a>
</article>
</main></div>
</body>
</html>
